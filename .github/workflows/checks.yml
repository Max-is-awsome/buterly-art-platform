name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: butterfly_test
          POSTGRES_PASSWORD: butterfly-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npm ci --prefix server
      - run: npm test --prefix server
      - run: node server/integration.mjs
        env:
          TEST_DATABASE_URL: postgres://postgres:butterfly-test@localhost:5432/butterfly_test
